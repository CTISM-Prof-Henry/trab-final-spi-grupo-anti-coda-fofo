<div class="salas-content">
  <h2>Salas Cadastradas</h2>

  <table mat-table [dataSource]="salas" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let sala">{{ sala.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let sala">{{ sala.name }}</td>
    </ng-container>

    <ng-container matColumnDef="roomType">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let sala">{{ sala.roomType }}</td>
    </ng-container>

    <ng-container matColumnDef="center">
      <th mat-header-cell *matHeaderCellDef>Centro</th>
      <td mat-cell *matCellDef="let sala">{{ sala.center }}</td>
    </ng-container>

    <ng-container matColumnDef="capacity">
      <th mat-header-cell *matHeaderCellDef>Capacidade</th>
      <td mat-cell *matCellDef="let sala">{{ sala.capacity }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p *ngIf="salas.length === 0" class="empty-msg">
    Nenhuma sala cadastrada no momento.
  </p>
</div>
